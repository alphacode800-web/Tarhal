[build]
  command = "npm run build:seed && npm run build:client"
  functions = "netlify/functions"
  publish = "dist/spa"


[functions]
  external_node_modules = ["express", "sqlite3", "sqlite"]
  node_bundler = "esbuild"
  included_files = ["server/seed/**", "server/database/schema.sql"]
  
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

# SPA fallback — must come after API redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
